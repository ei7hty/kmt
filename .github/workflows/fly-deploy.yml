# Deploy main to Fly.
#
# The checks run first and the deploy only happens if they pass. Fly's generated
# workflow deploys on every push with no verification at all, which for this
# repo means a broken build reaches the URL the client opens on their phone.
#
# Nothing here can deploy from a branch or a pull request: `on.push.branches` is
# main only, and pull requests get the checks without the deploy. That matters
# more than usual here, because several agents push branches to this repo.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Keyed by ref, which the first version of this was not -- and that cost a
  # day. A bare `fly-deploy` puts every run in the repository into one queue, so
  # a pull-request push from any of the agents working here supersedes a queued
  # run on main and vice versa. Six runs were cancelled that way in one
  # afternoon: both gate runs on a PR, main's own run twice, and one that was
  # misread as main being red when it had simply never started.
  #
  # Per ref, the intent survives and the collateral stops: successive pushes to
  # main still supersede each other, a branch still supersedes its own earlier
  # run, and no branch can cancel main.
  #
  # cancel-in-progress stays false: interrupting a half-finished deploy is worse
  # than letting it land and replacing it.
  group: fly-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Tests, lint, build and audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # node:sqlite is why this is 24 and not 20. The backend will not
          # import on anything earlier.
          node-version: '24'
          cache: npm
      - run: npm ci
      # Every backend test file, not one named file: a new suite that CI does not
      # run is a suite that passes locally and guards nothing.
      - run: node --test backend/*.test.mjs
      - run: npx eslint src backend
      - run: npm run build

      # The built bundle is public. Supplier data is not supposed to be in it.
      #
      # This ran red for real: the snapshot was imported straight into
      # src/data/catalog.js's static fallback, so the deployed JS carried the
      # supplier's SKU, stock count, list price and product URL for all 1083
      # scraped tires, with the markup settings beside them -- the shop's cost
      # base, published. Fixed in #110; this is what stops it coming back
      # quietly, because nothing about that leak was visible in a diff.
      #
      # Placed here on purpose: after the build, because it reads dist/, and
      # before the Playwright install, which is the slowest step in the job.
      # A supplier-data regression fails in seconds instead of after a browser
      # download and three audit runs, and nothing later in the job can change
      # what the build already wrote.
      - run: node .forge/bundle-leak-check.mjs

      - run: npx playwright install --with-deps chromium

      # The click paths, gated before merge rather than only after deploy.
      #
      # These also run post-deploy, and that run is not redundant: only it
      # proves the SPA fallback on the real host, which is a server config this
      # job cannot exercise. What this one catches is a change that breaks a
      # click path, which previously passed its PR, merged, deployed, and only
      # then failed -- with main already broken.
      #
      # It runs backend/server.mjs with the built dist/, not `vite preview`.
      # A preview serves the frontend and nothing else, which was enough while
      # the whole flow lived in the browser. Requests and quotes are moving to
      # the backend, and an audit that cannot complete the flow proves nothing.
      # This is also the more faithful test either way: the gate now runs the
      # thing that gets deployed.
      #
      # KMT_BIND is what backend/server.mjs reads for its interface -- not HOST,
      # which it ignores. Loopback, so nothing on the runner network can reach it.
      #
      # The database is a temporary file and the password is a throwaway, both
      # thrown away with the runner. The password is passed to the audits so
      # they can sign in when the owner screen asks -- a hosted server always
      # asks, and a local one never does.
      #
      # AUDIT_BASE is set explicitly because the three scripts default to
      # different ports. Leave it unset and they quietly audit whatever else is
      # listening, which fails in both directions: a false red, or a false green
      # against a stale server.
      - name: Audit the built frontend against the real server
        env:
          AUDIT_BASE: http://localhost:4173
          # Must stay at least 12 characters: server.mjs refuses to boot on a
          # shorter one, and the failure surfaces as the wait loop below timing
          # out with "server did not start", which reads like a hang rather than
          # a rejected password.
          KMT_OWNER_PASSWORD: audit-only-password-not-a-secret
        run: |
          # node directly, not `npx`: npx spawns the server as a grandchild, so
          # $! would be the wrapper and killing it leaves the port held. That
          # does not matter here -- the runner is destroyed at the end of the
          # job -- but this file gets copied as an example, and the form that
          # leaks locally should not be the one on display.
          # Captured in a variable rather than inlined, so the trap below can
          # remove it. Inline, the path exists only in the backgrounded node's
          # environment and nothing left in this shell knows what to clean up.
          dbdir="$(mktemp -d)"

          KMT_OWNER_DB="$dbdir/audit.sqlite" \
          KMT_SESSION_SECRET=audit-only-session-secret \
          PORT=4173 \
          KMT_BIND=127.0.0.1 \
          node backend/server.mjs &
          server=$!
          # Both, and on any exit including a failed audit. The runner is
          # destroyed either way, so this is not for GitHub's benefit: it is so
          # the same block is safe on a self-hosted runner and safe to copy, and
          # a failed run cannot leave a listener holding 4173 for the next one.
          trap 'kill $server 2>/dev/null || true; rm -rf "$dbdir"' EXIT

          # stderr is dropped because the first attempts legitimately fail while
          # the server boots, and "connection refused" in the log reads like a
          # fault rather than the wait working. A real failure to start is
          # caught by the counter below.
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:4173/ 2>/dev/null && break
            if [ "$i" = "30" ]; then echo "server did not start in 60s"; exit 1; fi
            sleep 2
          done

          node .forge/dead-end-audit.mjs
          node .forge/request-flow-check.mjs
          node .forge/responsive-check.mjs

  # Does the image build, boot, and reach its data?
  #
  # Nothing else in this repository answers that. `flyctl deploy --remote-only`
  # builds and releases in one step, so before this job the first time anyone
  # ran a changed image was in production -- on the single machine that holds
  # the customer database and does not auto-restart. "Deploy it and watch" was
  # the only verification available for a Dockerfile change.
  #
  # It is also the gate for a failure this repository has now hit twice in one
  # day, caught both times by a person rather than a check: a .dockerignore rule
  # that excludes something the app reads at boot. The container starts, serves,
  # answers a health check, and has an empty catalog. Every test passes. That is
  # why this job asserts the catalog and not only health -- health alone sails
  # straight through it.
  image:
    name: The image builds and boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, because the step below diffs against the base.
          fetch-depth: 0

      # A docker build on a documentation change is cost with no return, so the
      # heavy steps are skipped rather than the job. A job that skips would take
      # `deploy` with it -- a skipped dependency skips its dependents -- and
      # every docs merge would stop deploying. So this job always runs and
      # always succeeds; it is the steps that are conditional.
      #
      # When it cannot tell what changed, it builds. A needless build costs four
      # minutes; a skipped one ships an image nobody ran.
      - name: Decide whether this change can affect the image
        id: scope
        run: |
          paths='^(Dockerfile|\.dockerignore|fly\.toml|package-lock\.json|package\.json|backend/|src/data/|\.github/workflows/)'

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base='${{ github.event.before }}'
          fi

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no usable base ref; building rather than guessing"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base" "${{ github.sha }}")"
          echo "changed files:"; echo "$changed"
          if echo "$changed" | grep -Eq "$paths"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing here can affect the image"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      # Built from the repository root with the real .dockerignore in play. That
      # is the point: the failure this catches is a file wrongly excluded from
      # the build context, which is invisible unless the context is the real one.
      - name: Build the image
        if: steps.scope.outputs.build == 'true'
        run: docker build -t kmt-gate .

      # Booted the way Fly boots it: a volume at /data, the database inside it,
      # a throwaway password. If the image ever cannot write there -- which is
      # exactly what dropping to a non-root user without changing /data
      # ownership would cause (#87) -- this is where it surfaces, as a red job
      # instead of a machine that will not start.
      - name: Boot it and prove it can serve
        if: steps.scope.outputs.build == 'true'
        run: |
          docker volume create kmt-gate-data
          docker run -d --name kmt-gate \
            -e KMT_OWNER_PASSWORD=gate-only-password-not-a-secret \
            -e KMT_SESSION_SECRET=gate-only-session-secret \
            -e KMT_OWNER_DB=/data/gate.sqlite \
            -e PORT=8080 \
            -v kmt-gate-data:/data \
            -p 8099:8080 \
            kmt-gate

          # Polled, not slept: the first boot runs the migration and the seed,
          # and both are silent, so their duration is not something to guess at.
          ready=false
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:8099/api/health 2>/dev/null; then
              ready=true; break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "FAIL: the container never became healthy in 120s"
            exit 1
          fi

          health="$(curl -fsS http://localhost:8099/api/health)"
          echo "health: $health"
          echo "$health" | grep -q '"ok":true' || { echo "FAIL: health did not report ok"; exit 1; }

          # The load-bearing assertion. /api/health proves the process can read
          # its database; it says nothing about whether the image contains the
          # files the app needs. The catalog is seeded at boot from
          # src/data/scraped-tires.json, so an empty one means that file did not
          # reach the image -- the .dockerignore failure, which looks like the
          # app working right up until a customer tries to buy a tire.
          #
          # It therefore depends on the seed running from that path. If seeding
          # ever moves, this assertion moves with it.
          tires="$(curl -fsS http://localhost:8099/api/catalog | jq '.tires | length')"
          echo "catalog rows: $tires"
          if [ "$tires" -lt 1 ]; then
            echo "FAIL: the image boots and serves an empty catalog."
            echo "The usual cause is a .dockerignore rule excluding src/data/."
            exit 1
          fi

      # A container that dies at boot leaves nothing else to read.
      - name: What the container said
        if: failure() && steps.scope.outputs.build == 'true'
        run: docker logs kmt-gate 2>&1 | tail -50

      - name: Clean up
        if: always() && steps.scope.outputs.build == 'true'
        run: |
          docker rm -f kmt-gate 2>/dev/null || true
          docker volume rm kmt-gate-data 2>/dev/null || true

  deploy:
    name: Deploy to Fly
    # Both, so an image that cannot boot stops the release. A Docker Hub hiccup
    # blocking a good deploy is the cost; a retry clears that, and nothing
    # clears an image already on the one machine that cannot open /data.
    needs: [check, image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to a commit, not @master. This step runs with FLY_API_TOKEN in
      # its environment -- a credential that can deploy and destroy the app --
      # so a moving branch here means whatever lands on it gets that token.
      # Bump deliberately: check what changed, then move the SHA.
      # ed8efb3 = master as of 2026-04-08.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # The browser audits are the project's actual contract, and they only mean
  # anything against a real deployment -- this build passed every local check
  # once and 404'd in production on a missing SPA rewrite. Running them after
  # the deploy does not prevent a bad release, but it does mean nobody has to
  # remember to check, and a failure here is the signal to roll back.
  verify:
    name: Audit the deployed site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for the new release to answer
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null https://kmt.fly.dev/; then exit 0; fi
            sleep 5
          done
          echo "kmt.fly.dev did not respond within 150s"; exit 1
      # What this run proves is the deploy, not the flow.
      #
      # The three flow audits perform the journey -- submit, approve, pay --
      # which is right against the temporary database the check job builds and
      # wrong here: on the deployed site they write real rows into the real
      # database, so every deploy would leave a fabricated request in the
      # owner's list, paid for. The owner's screen is a record of what
      # customers asked for.
      #
      # The flow is still proved on every pull request, against a real
      # backend/server.mjs with a real database, in the check job above. This
      # one reads: the site is up, the catalog is the shape the customer flow
      # is built on and leaks no supplier fields, the routes resolve through
      # the SPA fallback, the owner's data is still behind its password, and
      # nothing scrolls sideways on a phone. It signs into nothing, so no
      # production password belongs in this workflow.
      - run: node .forge/deployed-site-check.mjs
        env:
          AUDIT_BASE: https://kmt.fly.dev
