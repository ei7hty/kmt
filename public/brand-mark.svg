<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The wheel mark alone: navy ground, red tire, silver five-spoke. A stand-in
       drawn from the logo's composition until the licensed mark lands in
       public/brand/. No flame: that stays on the logo itself. -->
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#d6dbe0"/>
      <stop offset="0.55" stop-color="#9aa3ab"/>
      <stop offset="1" stop-color="#eef1f3"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0d1b24"/>
  <circle cx="32" cy="32" r="25" fill="#111d26" stroke="#ed1c24" stroke-width="5"/>
  <circle cx="32" cy="32" r="18" fill="#0d1b24" stroke="#d6dbe0" stroke-width="2"/>
  <g stroke="url(#chrome)" stroke-width="5" stroke-linecap="round">
    <line x1="32" y1="32" x2="32" y2="16"/>
    <line x1="32" y1="32" x2="47.2" y2="27.1"/>
    <line x1="32" y1="32" x2="41.4" y2="44.9"/>
    <line x1="32" y1="32" x2="22.6" y2="44.9"/>
    <line x1="32" y1="32" x2="16.8" y2="27.1"/>
  </g>
  <circle cx="32" cy="32" r="5.5" fill="url(#chrome)" stroke="#ed1c24" stroke-width="1.5"/>
</svg>
