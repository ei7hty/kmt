<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#080808" />
    <meta name="description" content="Mobile tire service in Malden, MA and Greater Boston. New tires fitted at your home, work or roadside." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mobile Tire Installation in Malden, MA | Ken's Mobile Tire" />
    <meta property="og:description" content="Mobile tire service around Malden, MA and Greater Boston. New tires fitted at your home or work." />
    <meta property="og:url" content="https://kensmobiletire.com/" />
    <meta property="og:image" content="https://kensmobiletire.com/brand/og-1200x630.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Job and place first, brand last. A searcher types "mobile tire
         installation malden", not a brand they have never heard; the slot is
         worth more than the name. Deliberately no speed or emergency term:
         MIN_LEAD_DAYS in backend/quotes.mjs puts a hard seven-day floor under
         every booking, so "same day" or "24/7" here would sell something the
         form cannot take. "Installation" rather than "service" because the
         description and the H1 already carry "service" -- between them they
         cover both words instead of repeating one. -->
    <title>Mobile Tire Installation in Malden, MA | Ken's Mobile Tire</title>
    <!-- Every value here is a fact the business has stated. Nothing is estimated,
         and fields nobody has supplied are absent rather than guessed. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AutoRepair",
        "@id": "https://kensmobiletire.com/#business",
        "name": "Ken's Mobile Tire",
        "description": "Mobile tire service in Malden, MA and Greater Boston. New tires fitted at your home, work or roadside.",
        "url": "https://kensmobiletire.com/",
        "image": "https://kensmobiletire.com/brand/og-1200x630.jpg",
        "logo": "https://kensmobiletire.com/brand/icon-512.png",
        "telephone": "+1-617-410-8319",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Malden",
          "addressRegion": "MA",
          "addressCountry": "US"
        },
        "areaServed": {
          "@type": "GeoCircle",
          "geoMidpoint": {
            "@type": "GeoCoordinates",
            "latitude": 42.42938,
            "longitude": -71.058706
          },
          "geoRadius": "40234"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
